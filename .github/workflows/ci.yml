name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows porque é onde a coleta costuma ficar agendada.
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      # Nenhum teste usa a internet: as páginas são cópias salvas do
      # books.toscrape.com e a loja de teste roda em 127.0.0.1.
      - name: Testes, com cobertura
        run: pytest --cov

      - name: Resumo da cobertura
        if: always()
        shell: bash
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
